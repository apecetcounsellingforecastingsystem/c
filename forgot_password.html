{% extends "base.html" %}
{% block title %}Forgot Password — AP ECET Counselling Forecasting System{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="glass-panel" style="padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <span style="font-size: 3rem;">🔑</span>
      <h2 style="font-size: 1.75rem; margin-top: 0.5rem;">Reset Password</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Enter your registered email address to receive password reset instructions</p>
    </div>

    <form method="POST" action="{{ url_for('forgot_password') }}">
      <div style="margin-bottom: 1.5rem;">
        <label class="form-label" for="resetEmail">Registered Email</label>
        <input type="email" id="resetEmail" name="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
      </div>

      <button type="submit" class="btn-primary-glass" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
        Send Recovery Code →
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
      Remember your credentials? 
      <a href="{{ url_for('login') }}" style="font-weight: 600;">Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
