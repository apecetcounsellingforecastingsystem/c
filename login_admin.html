{% extends "base.html" %}
{% block title %}Administrator Portal Login — AP ECET{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  
  <div class="glass-panel" style="padding: 2.5rem 2rem; border-color: rgba(14, 165, 233, 0.25);">
    
    <!-- Title -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon-box" style="margin: 0 auto 1rem; width: 56px; height: 56px; font-size: 1.8rem; background: rgba(14, 165, 233, 0.15); border: 1px solid var(--accent-cyan);">
        🛡️
      </div>
      <h2 style="font-size: 1.75rem;">Administrator Portal</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.35rem;">
        Authorized examination officers and administrators back-office sign in
      </p>
    </div>

    <!-- Admin Login Form -->
    <form method="POST" action="{{ url_for('admin_login') }}">
      
      <!-- Email Field -->
      <div style="margin-bottom: 1.25rem;">
        <label class="form-label" for="adminEmail">Official Email Address</label>
        <input type="email" id="adminEmail" name="email" class="form-control" placeholder="name@example.com" required autocomplete="username">
      </div>

      <!-- Password Field with Modern SVG Show/Hide Toggle -->
      <div style="margin-bottom: 1.25rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" for="adminPassword" style="margin-bottom:0;">Password</label>
        </div>
        <div style="position: relative;">
          <input type="password" id="adminPassword" name="password" class="form-control" placeholder="Enter administrative password" required style="padding-right: 2.8rem;" autocomplete="current-password">
          <button type="button" class="password-toggle-btn" data-target="adminPassword" title="Toggle password visibility" aria-label="Toggle password visibility">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-primary-glass" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
        <span>🔒</span> Authenticate Officer Session
      </button>

    </form>

    <!-- Student Portal Link -->
    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--glass-border); font-size: 0.85rem;">
      <span style="color: var(--text-muted);">Looking for Candidate Portal?</span>
      <a href="{{ url_for('login') }}" style="color: var(--accent-cyan); font-weight: 600; margin-left: 0.35rem;">
        Go to Student Login →
      </a>
    </div>

  </div>

</div>
{% endblock %}
